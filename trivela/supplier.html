<!DOCTYPE html>
<html lang="ar">
<head>
  <link rel="manifest" href="supplier-manifest.json">
  <link rel="icon" type="image/png" href="logo-official.png"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة تحكم الموردين | Trivela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="style.css?v=3.5"/>
  <style>
    /* Premium Light Theme aesthetic matching the main store */
    :root {
      --supplier-card-bg: rgba(255, 255, 255, 0.82);
      --supplier-border: rgba(75, 70, 197, 0.16);
      --supplier-text: #334155;
      --supplier-title: #1e1b4b;
      --supplier-primary: #4b46c5;
    }

    body.supplier-theme {
      color: var(--supplier-text) !important;
      font-family: 'Cairo', sans-serif;
    }

    .supplier-card {
      background: var(--supplier-card-bg) !important;
      border: 1px solid var(--supplier-border) !important;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(75, 70, 197, 0.05), 0 8px 16px -6px rgba(0, 0, 0, 0.03) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--supplier-text) !important;
    }

    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px 30px;
      background: var(--supplier-card-bg) !important;
      border: 1px solid var(--supplier-border) !important;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(75, 70, 197, 0.12) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .supplier-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1 !important;
      border-radius: 8px;
      background: #ffffff !important;
      color: #0f172a !important;
      font-family: Cairo, Montserrat;
      font-weight: bold;
      margin-bottom: 15px;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .supplier-input:focus {
      border-color: var(--supplier-primary) !important;
      box-shadow: 0 0 0 3px rgba(75, 70, 197, 0.1) !important;
      outline: none;
    }

    .supplier-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #4b46c5, #2a63d0) !important;
      color: #fff !important;
      font-family: Cairo;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(75, 70, 197, 0.2) !important;
    }
    .supplier-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(75, 70, 197, 0.3) !important;
    }

    .creds-box {
      background: rgba(75, 70, 197, 0.03) !important;
      border: 1px dashed rgba(75, 70, 197, 0.22) !important;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
      font-family: Montserrat, Cairo;
      font-size: 0.88rem;
      color: var(--supplier-text) !important;
    }

    .creds-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px dashed rgba(75, 70, 197, 0.08) !important;
      padding-bottom: 6px;
    }
    .creds-row:last-child {
      border-bottom: 0 !important;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .supplier-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(75, 70, 197, 0.1) !important;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }

    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1.5px solid rgba(75, 70, 197, 0.1) !important;
      padding-bottom: 8px;
    }
    .tab-btn {
      background: transparent;
      color: #64748b !important;
      border: 0;
      font-family: Cairo;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: rgba(75, 70, 197, 0.08) !important;
      color: var(--supplier-primary) !important;
    }

    .copy-btn {
      background: rgba(75, 70, 197, 0.07) !important;
      border: 0;
      border-radius: 4px;
      color: var(--supplier-primary) !important;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-family: Cairo;
      font-weight: bold;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: rgba(75, 70, 197, 0.15) !important;
    }

    .strike-through {
      text-decoration: line-through !important;
      opacity: 0.45 !important;
      background: rgba(255,255,255,0.02) !important;
      border-color: rgba(255,255,255,0.05) !important;
    }

    .code-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
      font-family: Montserrat;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .code-badge:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }

    .search-filter-row {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      flex: 1.5;
      min-width: 250px;
      position: relative;
    }

    .platform-filter-wrap {
      flex: 1;
      min-width: 180px;
    }
  </style>
</head>
<body class="supplier-theme rtl">

  <div class="container" style="max-width: 900px; margin: 40px auto; padding: 0 15px; box-sizing: border-box;">

    <!-- Login Box -->
    <div id="supplierLoginPanel" class="login-container">
      <img src="logo-official.png" alt="Trivela" style="width: 70px; margin-bottom: 15px;" />
      <h2 style="font-family: Cairo; font-weight: 900; margin-top: 0; margin-bottom: 25px; color: #1e1b4b;">لوحة الموردين — Trivela</h2>
      
      <form id="supplierLoginForm" onsubmit="handleSupplierLogin(event)">
        <input type="text" id="suppUsername" class="supplier-input" placeholder="اسم المستخدم للمورد" required />
        <input type="password" id="suppPassword" class="supplier-input" placeholder="كلمة المرور" required />
        <button type="submit" class="supplier-btn">تسجيل الدخول</button>
      </form>
    </div>

    <!-- Dashboard Portal (Hidden by default) -->
    <div id="supplierPortalPanel" style="display: none;">
      <div class="supplier-header">
        <div>
          <h2 style="font-family: Cairo; font-weight: 900; margin: 0; color: #1e1b4b;">لوحة الموردين (Supplier Portal)</h2>
          <span style="font-size: 0.85rem; color: #475569; font-family: Cairo;" id="txtSupplierWelcome">مرحباً، مورد</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button id="pwaInstallBtn" style="display: none; background: #10b981; color: white; border: 0; padding: 8px 16px; border-radius: 8px; font-family: Cairo; font-weight: bold; cursor: pointer; align-items: center; gap: 6px;">
            <i class="fas fa-download"></i> تثبيت التطبيق
          </button>
          <button onclick="handleSupplierLogout()" style="background: #ef4444; color: white; border: 0; padding: 8px 16px; border-radius: 8px; font-family: Cairo; font-weight: bold; cursor: pointer;">
            تسجيل الخروج
          </button>
        </div>
      </div>

      <!-- Supplier Coin Pricing Management Section -->
      <div style="background: linear-gradient(135deg, rgba(75, 70, 197, 0.05), rgba(75, 70, 197, 0.01)); border: 1px solid rgba(75, 70, 197, 0.16); border-radius: 16px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
        <h4 style="font-family: Cairo; font-weight: bold; margin-top: 0; margin-bottom: 15px; color: #4b46c5; font-size: 0.95rem; display: flex; align-items: center; gap: 8px;"><i class="fas fa-coins"></i> أسعار التوريد الخاصة بك (لكل 1 مليون كوينز):</h4>
        
        <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end;">
          <div style="flex: 1; min-width: 140px;">
            <label style="font-size: 0.76rem; font-weight: 700; color: #475569; display: block; margin-bottom: 6px; font-family: Cairo;">سعر المليون لسوني بلايستيشن / كونسول ($ USD)</label>
            <input type="number" step="0.01" id="pricingConsoleInput" class="supplier-input" placeholder="مثال: 9.50" style="margin: 0;" />
          </div>
          <div style="flex: 1; min-width: 140px;">
            <label style="font-size: 0.76rem; font-weight: 700; color: #475569; display: block; margin-bottom: 6px; font-family: Cairo;">سعر المليون للـ PC / الكمبيوتر ($ USD)</label>
            <input type="number" step="0.01" id="pricingPcInput" class="supplier-input" placeholder="مثال: 8.00" style="margin: 0;" />
          </div>
          <div>
            <button onclick="saveSupplierPricing()" class="supplier-btn" style="background: linear-gradient(135deg, #4b46c5, #2a63d0); padding: 12px 25px; min-width: 120px; margin: 0;">حفظ الأسعار</button>
          </div>
        </div>
        <div id="pricingUpdateAlert" style="display: none; margin-top: 10px; font-size: 0.78rem; color: #10b981; font-family: Cairo; font-weight: bold;"><i class="fas fa-circle-check"></i> تم حفظ وتحديث أسعار التوريد بنجاح!</div>
      </div>

      <!-- Stats Summary Cards -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
        <div style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.05)); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
          <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(16, 185, 129, 0.2); display: flex; align-items: center; justify-content: center; color: #10b981; font-size: 1.5rem;">
            <i class="fas fa-wallet"></i>
          </div>
          <div>
            <div style="font-size: 0.8rem; color: #94a3b8; font-family: Cairo;">إجمالي مستحقاتك</div>
            <div style="font-size: 1.25rem; font-weight: 900; font-family: Montserrat; color: #10b981;" id="statTotalEarnings">$0.00 <span style="font-size: 0.8rem; font-family: Cairo; color: #94a3b8;">(0 ر.س)</span></div>
          </div>
        </div>
        
        <div style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(29, 78, 216, 0.03)); border: 1px solid rgba(59, 130, 246, 0.22); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
          <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(59, 130, 246, 0.15); display: flex; align-items: center; justify-content: center; color: #2563eb; font-size: 1.5rem;">
            <i class="fas fa-check-circle"></i>
          </div>
          <div>
            <div style="font-size: 0.8rem; color: #475569; font-family: Cairo;">الطلبات المكتملة</div>
            <div style="font-size: 1.4rem; font-weight: 900; font-family: Montserrat; color: #1e1b4b;" id="statCompletedCount">0</div>
          </div>
        </div>

        <div style="background: linear-gradient(135deg, rgba(168, 85, 247, 0.08), rgba(124, 58, 237, 0.03)); border: 1px solid rgba(168, 85, 247, 0.22); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
          <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(168, 85, 247, 0.15); display: flex; align-items: center; justify-content: center; color: #7c3aed; font-size: 1.5rem;">
            <i class="fas fa-spinner fa-spin-pulse"></i>
          </div>
          <div>
            <div style="font-size: 0.8rem; color: #475569; font-family: Cairo;">الطلبات الجارية والجديدة</div>
            <div style="font-size: 1.4rem; font-weight: 900; font-family: Montserrat; color: #1e1b4b;" id="statActiveCount">0</div>
          </div>
        </div>
      </div>

      <!-- Tab Filters -->
      <div class="tab-bar">
        <button class="tab-btn active" id="btnActiveTab" onclick="switchSupplierTab('active')">الطلبات النشطة والجديدة</button>
        <button class="tab-btn" id="btnCompletedTab" onclick="switchSupplierTab('completed')">الطلبات المكتملة</button>
      </div>

      <!-- Search & Filter Controls -->
      <div class="search-filter-row" style="margin-bottom: 20px;">
        <div style="flex: 1.5; min-width: 250px;">
          <label style="font-size: 0.76rem; font-weight: 700; color: #475569; display: block; margin-bottom: 5px; font-family: Cairo;">ابحث بالطلب أو الخدمة:</label>
          <input type="text" id="supplierSearchInput" class="supplier-input" placeholder="🔍 رقم الطلب أو الخدمة..." style="margin: 0;" oninput="onSearchOrFilterChange()" />
        </div>
        <div style="flex: 1; min-width: 150px;">
          <label style="font-size: 0.76rem; font-weight: 700; color: #475569; display: block; margin-bottom: 5px; font-family: Cairo;">تصفية المنصات:</label>
          <select id="platformFilterSelect" class="supplier-input" style="margin: 0;" onchange="onSearchOrFilterChange()">
            <option value="all">كل المنصات</option>
            <option value="console">سوني / اكس بوكس (Console)</option>
            <option value="pc">بي سي (PC)</option>
          </select>
        </div>
        <div style="flex: 1.2; min-width: 180px;">
          <label style="font-size: 0.76rem; font-weight: 700; color: #475569; display: block; margin-bottom: 5px; font-family: Cairo;">تصفية التاريخ والوقت:</label>
          <select id="dateFilterSelect" class="supplier-input" style="margin: 0;" onchange="onDateFilterSelectChange()">
            <option value="all">كل الأوقات</option>
            <option value="today">اليوم</option>
            <option value="yesterday">الأمس</option>
            <option value="week">آخر 7 أيام</option>
            <option value="month">آخر 30 يوم</option>
            <option value="custom">فترة مخصصة...</option>
          </select>
        </div>
        <div style="display: flex; align-items: flex-end; padding-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="chkAutoRefresh" onchange="toggleAutoRefresh(this)" style="width: 18px; height: 18px; cursor: pointer;" />
            <label for="chkAutoRefresh" style="font-size: 0.82rem; font-family: Cairo; color: #475569; cursor: pointer; user-select: none; font-weight: bold;">تحديث تلقائي (60ث)</label>
          </div>
        </div>
      </div>

      <!-- Custom Date Range Inputs (Hidden by default) -->
      <div id="customDateRangeContainer" style="display: none; background: rgba(75, 70, 197, 0.04); border: 1px solid rgba(75, 70, 197, 0.12); border-radius: 12px; padding: 15px; margin-bottom: 20px;">
        <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
          <div style="flex: 1; min-width: 140px;">
            <label style="font-size: 0.76rem; font-weight: 700; color: #475569; display: block; margin-bottom: 5px; font-family: Cairo;">تاريخ البداية:</label>
            <input type="date" id="dateStartInput" class="supplier-input" style="margin: 0;" onchange="onSearchOrFilterChange()" />
          </div>
          <div style="flex: 1; min-width: 140px;">
            <label style="font-size: 0.76rem; font-weight: 700; color: #475569; display: block; margin-bottom: 5px; font-family: Cairo;">تاريخ النهاية:</label>
            <input type="date" id="dateEndInput" class="supplier-input" style="margin: 0;" onchange="onSearchOrFilterChange()" />
          </div>
        </div>
      </div>

      <!-- Orders List Container -->
      <div id="supplierOrdersListContainer">
        <div style="text-align: center; padding: 40px; color: #94a3b8; font-family: Cairo;">جاري تحميل الطلبات...</div>
      </div>
    </div>

  </div>

  <script src="supplier.js"></script>
</body>
</html>
